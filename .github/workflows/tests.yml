# Runs every mod's tests and the site's on each pull request and push to main.
# The tests stub Herdr's API, so they need only Node. `herdr-app check` needs
# the app and still runs locally.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test */tests/*.test.cjs site/tests/*.test.cjs
